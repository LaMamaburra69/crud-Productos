# Perfil "mysql": se activa con SPRING_PROFILES_ACTIVE=mysql
# Los valores salen de variables de entorno (las define docker-compose.yml).
# Si una variable no existe, se usa el valor que aparece despues de los dos puntos.

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:productosdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:productos}
spring.datasource.password=${DB_PASSWORD:productos123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# update: crea la tabla la primera vez y conserva los datos en los reinicios
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# La consola de H2 no aplica con MySQL
spring.h2.console.enabled=false
