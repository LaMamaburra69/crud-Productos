spring.application.name=crud-productos

# Base de datos H2 en memoria (para desarrollo)
spring.datasource.url=jdbc:h2:mem:productosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# --- Para usar MySQL en lugar de H2 ---
# 1) Cambia la dependencia h2 por mysql-connector-j en el pom.xml
# 2) Descomenta y ajusta estas líneas:
