spring.application.name=crud-productos

# ---------------------------------------------------------------
# Perfil por defecto: H2 en memoria (IntelliJ y tests, sin instalar nada).
# Los datos se borran al detener la aplicacion.
# Para usar MySQL se activa el perfil "mysql" (ver application-mysql.properties).
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:productosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
